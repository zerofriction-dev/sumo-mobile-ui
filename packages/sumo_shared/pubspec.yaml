name: sumo_shared
description: >-
  Non-UI code shared by the three Sumo Flutter apps (provider / company /
  super-app): input formatters, validators, helpers, enums and plain
  JSON models that used to be copy-pasted into each app. No GetX, no routes,
  no widgets — those stay in the apps (or in zero_ui for widgets).
version: 0.1.0
publish_to: "none" # private package — consumed via Git (path: packages/sumo_shared)

environment:
  sdk: ^3.9.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
